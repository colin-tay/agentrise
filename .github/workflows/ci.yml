name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4 (Swift 6.1.x)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Check Swift version
        run: |
          swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.1'

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The comparison scenes as Core Graphics draws them (the `compare` job puts them next to Windows').
      - name: Render art gallery
        run: swift run ArtGallery art-gallery

      - name: Upload art gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: art-gallery-macos
          path: art-gallery/
          if-no-files-found: error

      # The art and motion baselines take CI's renders as the reference: when the tests fail, hand over what
      # this job actually rendered (replace the fixtures with it if the difference is a CI image change).
      - name: Upload rendered scene snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scene-snapshots
          path: .build/scene-snapshots/
          if-no-files-found: warn

      - name: Build app bundle
        run: scripts/build-app.sh debug

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift 6.1.2
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - name: Check Swift version
        shell: pwsh
        run: |
          $version = swift --version 2>&1 | Out-String
          Write-Output $version
          if ($version -notmatch 'Swift version 6\.1') { exit 1 }

      - name: Build
        shell: pwsh
        run: swift build

      - name: Direct2D spike
        shell: pwsh
        run: |
          swift run D2DSpike spike.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Direct2D spike image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d2d-spike
          path: spike.png
          if-no-files-found: error

      - name: Test
        shell: pwsh
        run: swift test

      # The app itself (Agentrise.exe), on a data directory whose name has a space and Chinese characters: it must
      # start, let a second instance defer to it, take three Claude hook events (the recorded hook payloads in
      # Tests/AgentriseTests/Fixtures/codex, which use Claude Code's hook schema) through agentrise-hook.exe pointed
      # at the same directory with LOCALAPPDATA (how the hook always computes its socket), write a screenshot of its
      # window after 8 s and exit with 0. ffmpeg's gdigrab captures the whole desktop meanwhile.
      - name: App smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'ar 测试'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $bin = (swift build --show-bin-path | Out-String).Trim()
          $exe = Join-Path $bin 'Agentrise.exe'
          $hook = Join-Path $bin 'agentrise-hook.exe'
          $shot = Join-Path $data 'shot.png'
          $log = Join-Path $data 'Agentrise\agentrise.log'
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          function Start-App([string[]] $arguments) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in $arguments) { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            return [System.Diagnostics.Process]::Start($psi)
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ffmpeg) { Write-Output "ffmpeg on the runner: $($ffmpeg.Source)" }
          else {
            Write-Output 'ffmpeg not on the runner: installing it with Chocolatey'
            choco install ffmpeg --version 7.1.1 -y --no-progress
            $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
          }
          $app = Start-App @('--data-dir', $data, '--screenshot', $shot, '--after', '8', '--size', '1200x800')
          Start-Sleep -Seconds 3
          $second = Start-App @('--data-dir', $data)
          if (-not $second.WaitForExit(10000)) { $second.Kill(); throw 'the second instance did not exit' }
          Write-Output "second instance exit code: $($second.ExitCode)"
          if ($second.ExitCode -ne 0) { throw 'the second instance did not exit with 0' }
          # The hook's environment as Claude Code's CLI runs it (a Claude session without an entrypoint is a headless
          # run, which the tower doesn't show), with its data directory moved to the app's.
          $env:LOCALAPPDATA = $data
          $env:CLAUDE_CODE_ENTRYPOINT = 'cli'
          foreach ($f in 'session-start', 'user-prompt-submit', 'permission-request') {
            Get-Content -Raw "Tests/AgentriseTests/Fixtures/codex/$f.json" | & $hook
            if ($LASTEXITCODE -ne 0) { throw "agentrise-hook.exe failed on $f" }
          }
          Start-Sleep -Seconds 2
          ffmpeg -hide_banner -loglevel error -y -f gdigrab -framerate 1 -i desktop -frames:v 1 smoke/desktop.png
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::gdigrab could not capture the desktop ($LASTEXITCODE)" }
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Agentrise.exe did not exit after its screenshot' }
          Write-Output "Agentrise.exe exit code: $($app.ExitCode)"
          Get-Content $log
          if ($app.ExitCode -ne 0) { throw 'Agentrise.exe did not exit with 0' }
          if (-not (Test-Path $shot)) { throw 'no shot.png' }
          Copy-Item $shot smoke/shot.png
          Copy-Item $log smoke/agentrise.log
          $text = Get-Content -Raw $log
          if ($text -notmatch 'from the manifest') { throw 'the manifest did not make the process DPI aware' }
          if ($text -notmatch 'comctl32 6\.') { throw 'comctl32 6 is not active (manifest)' }
          if ($text -notmatch 'second instance') { throw 'the second instance left no trace' }
          if ($text -notmatch 'sessions 1') { throw 'the hook events did not reach the app' }

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: smoke/
          if-no-files-found: warn

      # The comparison scenes as Direct2D/DirectWrite draw them.
      - name: Render art gallery
        shell: pwsh
        run: |
          swift run ArtGallery art-gallery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload art gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: art-gallery-windows
          path: art-gallery/
          if-no-files-found: error

  # Each comparison scene, macOS on the left and Windows on the right, for checking by eye (spec §5.1).
  compare:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS art gallery
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: art-gallery-macos
          path: gallery/macos

      - name: Download Windows art gallery
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: art-gallery-windows
          path: gallery/windows

      - name: Stitch side by side
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow==11.3.0
          .venv/bin/python scripts/side-by-side.py gallery/macos gallery/windows comparison

      - name: Upload comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: comparison/
          if-no-files-found: error
