name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4 (Swift 6.1.x)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Check Swift version
        run: |
          swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.1'

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The comparison scenes as Core Graphics draws them (the `compare` job puts them next to Windows').
      - name: Render art gallery
        run: swift run ArtGallery art-gallery

      - name: Upload art gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: art-gallery-macos
          path: art-gallery/
          if-no-files-found: error

      # The art and motion baselines take CI's renders as the reference: when the tests fail, hand over what
      # this job actually rendered (replace the fixtures with it if the difference is a CI image change).
      - name: Upload rendered scene snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scene-snapshots
          path: .build/scene-snapshots/
          if-no-files-found: warn

      - name: Build app bundle
        run: scripts/build-app.sh debug

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift 6.1.2
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - name: Check Swift version
        shell: pwsh
        run: |
          $version = swift --version 2>&1 | Out-String
          Write-Output $version
          if ($version -notmatch 'Swift version 6\.1') { exit 1 }

      - name: Build
        shell: pwsh
        run: swift build

      - name: Test
        shell: pwsh
        run: swift test

      # The app itself (Agentrise.exe), on a data directory whose name has a space and Chinese characters: it must
      # start, let a second instance defer to it, take three Claude hook events (the recorded hook payloads in
      # Tests/AgentriseTests/Fixtures/codex, which use Claude Code's hook schema) through agentrise-hook.exe pointed
      # at the same directory with LOCALAPPDATA (how the hook always computes its socket), write a screenshot of its
      # window after 8 s and exit with 0. ffmpeg's gdigrab captures the whole desktop meanwhile. A second, portrait run
      # shows the panel as a strip. Before both, `--install-hooks claude` (twice) copies the hook to the data
      # directory's Agentrise\bin and writes its exec-form entry into .claude\settings.json there; the events then go
      # through that installed copy. The portrait run also opens the Settings window, and a second desktop capture shows
      # it (in the landscape run the second instance brings the tower window forward over it).
      - name: App smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'ar 测试'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $bin = (swift build --show-bin-path | Out-String).Trim()
          $exe = Join-Path $bin 'Agentrise.exe'
          $hook = Join-Path $bin 'agentrise-hook.exe'
          $shot = Join-Path $data 'shot.png'
          $log = Join-Path $data 'Agentrise\agentrise.log'
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          function Start-App([string[]] $arguments) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in $arguments) { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            return [System.Diagnostics.Process]::Start($psi)
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ffmpeg) { Write-Output "ffmpeg on the runner: $($ffmpeg.Source)" }
          else {
            Write-Output 'ffmpeg not on the runner: installing it with Chocolatey'
            choco install ffmpeg --version 7.1.1 -y --no-progress
            $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
          }
          # The hook's environment as Claude Code's CLI runs it (a Claude session without an entrypoint is a headless
          # run, which the tower doesn't show), with its data directory moved to the app's.
          function Send-Events {
            $saved = $env:LOCALAPPDATA
            $env:LOCALAPPDATA = $data
            $env:CLAUDE_CODE_ENTRYPOINT = 'cli'
            foreach ($f in 'session-start', 'user-prompt-submit', 'stop') {
              Get-Content -Raw "Tests/AgentriseTests/Fixtures/codex/$f.json" | & $hook
              if ($LASTEXITCODE -ne 0) { throw "agentrise-hook.exe failed on $f" }
            }
            $env:LOCALAPPDATA = $saved
            Remove-Item Env:CLAUDE_CODE_ENTRYPOINT
          }
          function Wait-App($app, [string] $png) {
            if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Agentrise.exe did not exit after its screenshot' }
            Write-Output "Agentrise.exe exit code: $($app.ExitCode)"
            if ($app.ExitCode -ne 0) { Get-Content $log; throw 'Agentrise.exe did not exit with 0' }
            if (-not (Test-Path $png)) { throw "no $png" }
          }

          # Hooks: install Claude Code's twice into the data directory (never the runner's real ~\.claude). The second
          # run must not add a second entry, and must back the first file up.
          $settings = Join-Path $data '.claude\settings.json'
          $installed = Join-Path $data 'Agentrise\bin\agentrise-hook.exe'
          foreach ($i in 1, 2) {
            $p = Start-App @('--data-dir', $data, '--install-hooks', 'claude')
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw '--install-hooks did not exit' }
            if ($p.ExitCode -ne 0) { Get-Content $log; throw "--install-hooks exited with $($p.ExitCode)" }
          }
          if (-not (Test-Path -LiteralPath $installed)) { throw "no $installed" }
          Get-Content -Raw -Encoding utf8 -LiteralPath $settings
          $json = Get-Content -Raw -Encoding utf8 -LiteralPath $settings | ConvertFrom-Json
          foreach ($prop in $json.hooks.PSObject.Properties) {
            $ours = @($prop.Value | Where-Object { $_.hooks[0].command -eq $installed })
            if ($ours.Count -ne 1) { throw "$($prop.Name): $($ours.Count) Agentrise entries, expected 1" }
            if (($ours[0].hooks[0].args -join ' ') -ne '--agent claude') { throw "$($prop.Name): wrong args" }
          }
          if (@($json.hooks.PSObject.Properties).Count -ne 12) { throw 'expected 12 Claude Code events' }
          $backups = @(Get-ChildItem -LiteralPath (Join-Path $data '.claude') -Filter 'settings.json.agentrise-backup-*')
          if ($backups.Count -lt 1) { throw 'the second install wrote no backup' }
          $hook = $installed   # the events below run the installed copy, as Claude Code would

          # Landscape, as CI's 1024 × 768 desktop allows: a second instance, the events, the desktop capture.
          $app = Start-App @('--data-dir', $data, '--screenshot', $shot, '--after', '8', '--size', '1200x800')
          Start-Sleep -Seconds 3
          $second = Start-App @('--data-dir', $data)
          if (-not $second.WaitForExit(10000)) { $second.Kill(); throw 'the second instance did not exit' }
          Write-Output "second instance exit code: $($second.ExitCode)"
          if ($second.ExitCode -ne 0) { throw 'the second instance did not exit with 0' }
          Send-Events
          Start-Sleep -Seconds 2
          ffmpeg -hide_banner -loglevel error -y -f gdigrab -framerate 1 -i desktop -frames:v 1 smoke/desktop.png
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::gdigrab could not capture the desktop ($LASTEXITCODE)" }
          Wait-App $app $shot
          Copy-Item $shot smoke/shot.png

          # Portrait (the panel becomes a strip).
          $portrait = Join-Path $data 'shot-portrait.png'
          $app = Start-App @('--data-dir', $data, '--screenshot', $portrait, '--after', '6', '--size', '560x720', '--open-settings')
          Start-Sleep -Seconds 3
          Send-Events
          Start-Sleep -Seconds 1
          ffmpeg -hide_banner -loglevel error -y -f gdigrab -framerate 1 -i desktop -frames:v 1 smoke/desktop-settings.png
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::gdigrab could not capture the desktop ($LASTEXITCODE)" }
          Wait-App $app $portrait
          Copy-Item $portrait smoke/shot-portrait.png

          Get-Content $log
          Copy-Item $log smoke/agentrise.log
          $text = Get-Content -Raw $log
          if ($text -notmatch 'from the manifest') { throw 'the manifest did not make the process DPI aware' }
          if ($text -notmatch 'comctl32 6\.') { throw 'comctl32 6 is not active (manifest)' }
          if ($text -notmatch 'second instance: showed the running one') { throw 'the second instance did not defer to the first' }
          if (([regex]::Matches($text, 'sessions 1,')).Count -ne 2) { throw 'the hook events did not reach the app' }
          if (([regex]::Matches($text, 'install-hooks claude: .* written')).Count -ne 2) { throw 'install-hooks did not log its writes' }

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: smoke/
          if-no-files-found: warn

      # The comparison scenes as Direct2D/DirectWrite draw them.
      - name: Render art gallery
        shell: pwsh
        run: |
          swift run ArtGallery art-gallery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload art gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: art-gallery-windows
          path: art-gallery/
          if-no-files-found: error

  # Each comparison scene, macOS on the left and Windows on the right, for checking by eye (spec §5.1).
  compare:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS art gallery
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: art-gallery-macos
          path: gallery/macos

      - name: Download Windows art gallery
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: art-gallery-windows
          path: gallery/windows

      - name: Stitch side by side
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow==11.3.0
          .venv/bin/python scripts/side-by-side.py gallery/macos gallery/windows comparison

      - name: Upload comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: comparison/
          if-no-files-found: error
