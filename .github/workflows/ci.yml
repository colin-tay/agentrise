name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4 (Swift 6.1.x)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Check Swift version
        run: |
          swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.1'

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh debug
